[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reels-factory-engine"
version = "0.1.0"
description = "Движок коробочной фабрики рилсов: сценарий, TTS (ElevenLabs), аватар (HeyGen), сборка split/fullscreen, QA-гейты."
requires-python = ">=3.11"
dependencies = [
    "requests",
    "yt-dlp",
    "faster-whisper",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
reels-factory = "reels_factory.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: тесты с сетью, ffmpeg или загрузкой модели",
]
