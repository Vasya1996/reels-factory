[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reels-factory-engine"
version = "0.2.0"
description = "Движок коробочной фабрики рилсов: сценарий, TTS (ElevenLabs), аватар (HeyGen), сборка split/fullscreen, QA-гейты."
requires-python = ">=3.11"
dependencies = [
    "requests",
    "yt-dlp",
    "faster-whisper",
    "pyyaml",
    # Детектор лица. Ниже 5: в 5.x нет cv2.CascadeClassifier, и без него
    # detect_face_anchor молча отдаёт запасной якорь — гейт «текст не на лице»
    # начинает охранять пустое место.
    "opencv-python-headless<5",
]

[project.optional-dependencies]
dev = ["pytest"]
# монтажный слой: нужен только при edit.jump_cuts — базовая установка без него
edit = ["auto-editor"]
# телеграм-бот: нужен только при запуске python -m reels_factory.bot
bot = ["python-telegram-bot>=21"]
# семантический b-roll (Модуль B): CLIP-подбор клипов. Тяжёлый (torch), поэтому
# опционально — pip install -e .[broll]. Мультиязычный CLIP тянет transformers.
broll = ["open_clip_torch", "torch", "transformers", "pillow"]

[project.scripts]
reels-factory = "reels_factory.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: тесты с сетью, ffmpeg или загрузкой модели",
]
