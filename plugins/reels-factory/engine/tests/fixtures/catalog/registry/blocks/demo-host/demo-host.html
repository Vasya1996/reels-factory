<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>demo-host</title>
    <style>
      #demo-host-root { position: absolute; inset: 0; }
      .dmh-screen > img,
      .dmh-screen > video { width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <template data-slot="demo-host-screen"></template>
    <div id="demo-host-root" data-composition-id="demo-host" data-width="1080" data-height="1920" data-duration="4">
      <div class="dmh-screen"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["demo-host"] = null;
    </script>
  </body>
</html>
