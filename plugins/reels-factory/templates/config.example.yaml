# =============================================================================
# factory/config.yaml — конфиг фабрики рилсов.
#
# Заполняется мастером `/reels-factory:setup` (руками — тоже можно, формат
# ниже). Схема СИНХРОННА с engine/src/reels_factory/config.py (load_config) —
# при любых правках движка сверяйся с ней заново.
#
# Поля с пометкой [обязательно] проверяются load_config: без них движок
# откажется запускаться и объяснит, чего не хватает, по-русски. Остальные
# поля опциональны — их читают другие модули движка (scenario/compose/verify)
# либо только скиллы продуктового цикла (research/script/make/review), либо
# это просто заметка для тебя самого.
# =============================================================================

# Тема рилсов — как она пишется (заголовки, анализ, поиск). [обязательно]
theme: "кофе дома"

# Как тема ЗВУЧИТ в речи ведущего (склонение/сокращение), если отличается от
# theme. Используется в промпте сценария (проверка «тема упомянута в первых
# фразах» — scenario.py) и в автоисправлении субтитров (падежные словоформы
# корня темы — compose.build_caption_fixes). Необязательно, по умолчанию
# берётся theme.
theme_spoken: "кофе"

# Доп. варианты написания темы для caption-фиксов — то, что мог услышать
# Whisper вместо темы, но должно чиниться на display (theme) при сборке
# субтитров. Список строк, можно оставить пустым.
theme_captions: []

# Ключевые слова ниши — ТОЛЬКО для скилла research (поиск виральных роликов
# по теме на YouTube и подбор видеоряда). Движком (script/make/verify) не
# читаются.
niche_keywords:
  - "кофе рецепты"
  - "кофе дома без кофемашины"

# Активный язык текущего CLI-конфига/job snapshot. В Telegram язык выбирается
# заново после каждого /start и /new. Поддерживаемые кнопками языки: ru, kk.
# Передаётся Eleven v3 как language_code и локальной транскрибации медиа.
language: ru

# Формат сборки. [обязательно] split | fullscreen | avatar
#   split      — аватар-ведущий (HeyGen) сверху 1080x672 + видеоряд снизу
#                1080x1248. В master-path HeyGen — беззвучный visual layer.
#                Фото для HeyGen —
#                ГОРИЗОНТАЛЬНОЕ (≈1.6:1, лицо по центру). Дороже (HeyGen
#                рендерит видео на каждый блок).
#   fullscreen — видеоряд на весь кадр 1080x1920, голос ведущего за кадром
#                (только TTS ElevenLabs, HeyGen НЕ рендерится) — вдвое дешевле.
#                Фото не нужно.
#   avatar     — аватар-ведущий (HeyGen) на весь кадр 1080x1920; master voice
#                проигрывается отдельным единственным аудиослоем.
#                Фото для HeyGen — ВЕРТИКАЛЬНОЕ (9:16). Видеоряд опционален:
#                отдельные ВСТАВКИ поверх аватара (broll_plan сегменты с
#                "insert": true); без вставок видеоряд не нужен вовсе.
format: split

# Персонаж, который ВЕДЁТ ролик — под него пишутся реплики сценария
# (scenario.build_prompt подставляет описание и манеру речи в промпт).
persona:
  # Описание персонажа: кто это, тон, характер. [обязательно]
  # Примеры:
  #   "девушка-бариста, 25 лет, дружелюбная, говорит просто и по делу"
  #   "это я: парень 30 лет, прямой, без воды"
  description: "девушка-бариста, 25 лет, дружелюбная"

  # Манера речи (необязательно) — как персонаж строит фразы. Если задано,
  # уходит в промпт отдельной строкой «Манера речи персонажа: ...».
  # Пример для варианта «персонаж — это я»: "короткие фразы, прямота,
  # без канцелярита".
  speech_style: ""

# Продукт/бренд, который продвигает рилс.
product:
  # Имя продукта. Валидатор сценария следит, чтобы оно НЕ попало в хук (хук
  # цепляет зрителя сам по себе, без саморекламы) — упоминается только в CTA.
  # [обязательно]
  name: "Гайд по эспрессо дома"

  # Легенда — короткий контекст для LLM при генерации сценария (кто ведёт,
  # какой бэкграунд); зрителю не пересказывается в лоб. Опционально.
  legend: "Автор — бариста, 5 лет работал в кофейнях, теперь учит готовить дома."

  # Дословная фраза призыва к действию. ОБЯЗАНА войти в реплику блока cta
  # ровно этими словами — валидатор сценария проверяет точное вхождение
  # подстроки. [обязательно]
  cta_phrase: "пиши «кофе» в комментарии — пришлю гайд"

  # Карта caption-фиксов бренда/терминов: "как должно отображаться в
  # субтитрах" -> [варианты, которые мог услышать Whisper]. ФОРМАТ — ОБЪЕКТ
  # (display: [варианты]), НЕ список! Однословный вариант чинится по
  # префиксу (ловит падежные окончания); двусловный вариант (через пробел) —
  # биграмма, оба распознанных слова сливаются в один display.
  brand_captions:
    "Гайд по эспрессо": ["гайд по эспрессо", "гайт по эспрессо"]
    "бариста": ["барista", "баресто"]

# Аватар-ведущий (HeyGen v3 Avatar IV: фото + аудио -> говорящее видео).
# Нужен форматам split и avatar; для fullscreen блок можно опустить.
avatar:
  # Путь к фото аватара — для памяти/повторной загрузки; движком напрямую не
  # читается (используется на этапе setup при загрузке в HeyGen /v3/assets).
  # Ориентация фото зависит от формата: split — ГОРИЗОНТАЛЬНОЕ (≈1.6:1),
  # avatar — ВЕРТИКАЛЬНОЕ (9:16). Лицо держи по центру кадра.
  photo: "C:/path/to/avatar-photo.jpg"

  # id фото-ассета в HeyGen (после загрузки фото через POST /v3/assets).
  # [обязательно для format: split и format: avatar]
  heygen_asset_id: ""

  # Performance controls официально относятся к Photo Avatar / Avatar IV.
  # Motion prompt: обычный английский, одно видимое движение + необязательная
  # эмоция, не больше двух коротких частей. Не задавать камеру, сцену, фон,
  # реквизит, ходьбу, свет или timing.
  motion_prompt: >-
    Looks at the camera and gestures lightly with one hand, calm and confident.

  # low | medium | high. Консервативный default low; high использовать только
  # для фразы, которой действительно нужна усиленная подача.
  expressiveness: medium

# Активный голос ElevenLabs — обязательно голос языка `language`.
voice_id: ""

# Язык активного голоса. Обязан совпадать с language.
voice_language: ru

# Голоса пользователя по языкам. При первом запуске достаточно активного
# языка; второй бот запросит при первом ролике на этом языке и сохранит рядом.
# Значение активного языка обязано совпадать с voice_id.
voices:
  ru: ""
  # kk: "voice_id казахского клона"

# Одна связная озвучка всего утверждённого сценария. До production rollout
# оставлена выключенной: включать после fixture-тестов/согласованного smoke.
# То же можно сделать env RF_MASTER_AUDIO_ENABLED=1.
master_audio:
  enabled: false

# Canonical edit plan строится до платных стадий. Опциональный LLM-проход
# рекомендует expressiveness/motion_prompt отдельно для каждой phrase.
edit_plan:
  performance_llm:
    enabled: false
    timeout_s: 600
  # Avatar IV в bubble поверх полноэкранного смыслового визуала. Планировщик
  # использует bubble только для короткой последовательности/личного payoff,
  # не в hook/CTA и не чаще заданного лимита.
  bubble:
    enabled: true
    min_seconds: 3.0
    max_seconds: 6.0
    max_per_45_seconds: 1
    shape: circle
    position: bottom_left

# Производный render plan после master alignment. Только Photo Avatar IV:
# Avatar V / heygen_look_id этим этапом сознательно не затрагиваются.
# Включать вместе с master_audio после согласованного paid smoke.
avatar_islands:
  enabled: false
  # Короткие края запроса дают безопасный trim на exact master timeline.
  handle_seconds: 0.2
  min_request_seconds: 3.0
  # Совместимые phrase intents объединяются; значимая смена подачи, hook/CTA
  # или этот предел создают новый performance shot.
  target_shot_seconds: 10.0
  max_shot_seconds: 18.0
  max_shots_per_30_seconds: 5
  max_parallel: 2
  # Только прогноз до разрешения платного запуска; не источник биллинга.
  estimated_cost_per_second_usd: 0.05

# ElevenLabs Text-to-Speech with Timestamps.
tts:
  # Самая выразительная модель; 70+ языков, максимум 5000 символов/request.
  model_id: eleven_v3

  # Главный quality setting v3: 0 = Creative, 0.5 = Natural, 1 = Robust.
  # Natural сохраняет узнаваемость IVC и остаётся отзывчивым к audio tags.
  stability: 0.5

  # Best-effort повторяемость. Одинаковый seed не гарантирует идентичный звук.
  # seed: 42

  # auto | on | off. Auto безопаснее для чисел, дат и сокращений.
  apply_text_normalization: auto

  # Provider MP3 без требования Pro-тарифа; затем локально -> PCM 48 kHz stereo.
  output_format: mp3_44100_128

  # До трёх словарей ElevenLabs. Для v3 phoneme entries могут использовать IPA
  # и для неанглийских языков.
  pronunciation_dictionary_locators: []
  #  - pronunciation_dictionary_id: "..."
  #    version_id: "..."

# Для v3 НЕ добавлять speed, similarity_boost и use_speaker_boost: модель их
# не поддерживает. Style exaggeration держать 0/не передавать. Подачу задают
# пунктуация и одобренные пользователем теги [curious], [excited], [whispers],
# [laughs], [sighs]. SSML <break> в v3 не поддерживается.

# Видеоряд (broll). Сам движок берёт источник аргументом --broll команды
# `make` (ссылка YouTube или локальный файл) — это поле им НЕ читается.
broll:
  # Подсказка для скиллов research/make, где обычно искать видеоряд под
  # тему (плейлист/канал/локальная папка с материалами). Свободный текст.
  source_hint: "готовка эспрессо крупным планом; локальные файлы в broll/"

# Целевая длина legacy CLI-сценария. Telegram-путь получает length_s от
# выбранной идеи и уже поддерживает короткий панч 20-40с и разбор 60-90с.
# Для 30/60/90 меняется word budget, а islands автоматически масштабируют
# число shots; фиксированного «один HeyGen на блок» больше нет.
limits:
  target_duration_s: 30
  duration_s_min: 14
  duration_s_max: 90
