<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>G16 · app_price_cards</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  #stack{display:flex;flex-direction:column;gap:44px;margin-top:100px}
  .app{display:flex;align-items:center;gap:38px;background:var(--card);border:6px solid var(--ink);
    padding:38px 46px;box-shadow:var(--shadow-card);opacity:0;transform:rotate(var(--rot,0deg)) translateY(26px) scale(.92)}
  .app.in{opacity:1;transform:rotate(var(--rot,0deg)) translateY(0) scale(1);transition:opacity .26s var(--ease-pop),transform .36s var(--ease-pop)}
  .app .icon{width:110px;height:110px;border:5px solid var(--ink);border-radius:28px;flex:none;
    display:flex;align-items:center;justify-content:center;font-family:MontserratX,sans-serif;font-weight:900;font-size:52px;color:var(--ink)}
  .app .nm{flex:1;font-size:42px;font-weight:600;color:var(--ink)}
  .app .pr{font-family:MontserratX,sans-serif;font-weight:900;font-size:52px;color:var(--ink);
    background:var(--yellow);padding:6px 22px;transform:rotate(1.4deg)}
  #sum{align-self:flex-start;margin-top:90px;background:var(--red);color:var(--card);border:6px solid var(--ink);
    border-radius:38px 240px 34px 225px / 225px 34px 240px 38px;padding:44px 60px;
    font-family:MontserratX,sans-serif;font-weight:900;font-size:64px;box-shadow:var(--shadow-cta);
    opacity:0;transform:rotate(-1deg) scale(.8)}
  #sum.in{opacity:1;transform:rotate(-1deg) scale(1);transition:opacity .28s var(--ease-pop),transform .42s var(--ease-pop)}
</style>
</head>
<body>
<div id="fit"><div id="scene">
  <div class="tech" data-t="0"><span class="dash"></span><span class="lbl">Сервисы · Математика</span></div>
  <h1 style="font-size:96px"><span class="w" data-t="350">СКОЛЬКО</span> <span class="w" data-t="570">СТОИТ</span><br><span class="w hl" data-t="820"><i></i>ПО ОТДЕЛЬНОСТИ</span></h1>
  <div id="stack">
    <div class="app" style="--rot:-.6deg" data-t="1700"><div class="icon">Е</div><div class="nm">озвучка голосом</div><div class="pr">$22</div></div>
    <div class="app" style="--rot:.5deg" data-t="2700"><div class="icon">Н</div><div class="nm">видео-аватар</div><div class="pr">$29</div></div>
    <div class="app" style="--rot:-.4deg" data-t="3700"><div class="icon">М</div><div class="nm">монтажёр на фрилансе</div><div class="pr">$300</div></div>
  </div>
  <div id="sum" data-t="5100">= $351 / МЕСЯЦ</div>
  <div class="spacer"></div>
</div></div>
<script src="../../shared.js"></script>
</body>
</html>
