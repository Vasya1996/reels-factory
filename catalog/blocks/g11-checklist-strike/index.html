<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>G11 · checklist_strike v2</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  #list{display:flex;flex-direction:column;gap:46px;margin-top:100px}
  .res{align-self:flex-start;background:var(--yellow);border:6px solid var(--ink);border-radius:34px 240px 38px 225px / 225px 38px 240px 34px;
    padding:40px 54px;display:flex;align-items:center;gap:30px;box-shadow:var(--shadow-cta);
    font-family:MontserratX,sans-serif;font-weight:900;font-size:44px;text-transform:uppercase;color:var(--ink);
    opacity:0;transform:rotate(.8deg) scale(.8);margin-top:110px}
  .res.in{opacity:1;transform:rotate(.8deg) scale(1);transition:opacity .28s var(--ease-pop),transform .4s var(--ease-pop)}
  .res .tick{font-size:64px}
</style>
</head>
<body>
<div id="fit"><div id="scene">
  <div class="tech" data-t="0"><span class="dash"></span><span class="lbl">Продажи · Разбор</span></div>
  <h1><span class="w" data-t="350">ЭТО</span> <span class="w" data-t="550">ВСЁ</span><br><span class="w hl" data-t="800"><i></i>НЕ НУЖНО</span></h1>
  <div id="list">
    <div class="pill r1 strike" style="--rot:-.7deg" data-t="1700" data-strike="900"><u></u><span class="idx">01</span><span class="txt">хитрые приёмы</span></div>
    <div class="pill r2 strike" style="--rot:.6deg" data-t="3000" data-strike="900"><u></u><span class="idx">02</span><span class="txt">скрипты продаж</span></div>
    <div class="pill r3 strike" style="--rot:-.4deg" data-t="4300" data-strike="900"><u></u><span class="idx">03</span><span class="txt">волшебные фразы</span></div>
  </div>
  <div class="res" data-t="5900"><span>Нужен только порядок</span><span class="tick" data-t="6300">✓</span></div>
  <div class="spacer"></div>
</div></div>
<script src="../../shared.js"></script>
</body>
</html>
