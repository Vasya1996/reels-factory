<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>G12 · before_after v2</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  .lbl-s{align-self:flex-start;background:var(--ink);color:var(--card);font-family:JBMonoX,monospace;font-weight:700;
    font-size:30px;letter-spacing:.18em;text-transform:uppercase;padding:12px 26px;transform:rotate(-1deg);opacity:0}
  .lbl-s.in{opacity:1;transition:opacity .3s var(--ease)}
  .big{position:relative;background:var(--card);border:6px solid var(--ink);padding:64px 60px;margin-top:26px;
    box-shadow:var(--shadow-card);opacity:0;transform:rotate(-.6deg) translateY(30px)}
  .big.in{opacity:1;transform:rotate(-.6deg) translateY(0);transition:opacity .34s var(--ease),transform .42s var(--ease)}
  .big .val{font-family:MontserratX,sans-serif;font-weight:900;font-size:96px;line-height:1.05;color:var(--ink);text-transform:uppercase}
  .big .sub{font-size:38px;font-weight:600;color:rgba(27,27,24,.6);margin-top:14px}
  .cross{position:absolute;right:34px;top:-46px;font-family:CaveatX,cursive;font-size:190px;line-height:1;color:var(--red);
    opacity:0;transform:scale(.4) rotate(-30deg)}
  .cross.in{opacity:1;transform:scale(1) rotate(-8deg);transition:opacity .2s var(--ease-pop),transform .32s var(--ease-pop)}
  .dim.on .val,.dim.on .sub{color:rgba(27,27,24,.35);transition:color .3s}
  #after{margin-top:70px;background:var(--mint);border:6px solid var(--ink);border-radius:38px 240px 34px 225px / 225px 34px 240px 38px;
    padding:70px 60px;box-shadow:var(--shadow-cta);opacity:0;transform:rotate(.9deg) scale(.85)}
  #after.in{opacity:1;transform:rotate(.9deg) scale(1);transition:opacity .3s var(--ease-pop),transform .44s var(--ease-pop)}
  #after .val{font-family:MontserratX,sans-serif;font-weight:900;font-size:120px;color:var(--ink)}
  #after .sub{font-size:40px;font-weight:600;color:var(--ink);margin-top:10px}
  .arrow{font-family:CaveatX,cursive;font-size:120px;color:var(--ink);align-self:center;margin-top:34px;opacity:0;transform:translateY(14px) rotate(12deg)}
  .arrow.in{opacity:1;transform:translateY(0) rotate(12deg);transition:opacity .26s var(--ease),transform .3s var(--ease)}
</style>
</head>
<body>
<div id="fit"><div id="scene">
  <div class="tech" data-t="0"><span class="dash"></span><span class="lbl">Монтаж · До и после</span></div>
  <div class="lbl-s" data-t="400">БЫЛО</div>
  <div class="big dim" data-t="700" data-strike="1300">
    <div class="val">3 ЧАСА</div><div class="sub">на монтаж одного рилса руками</div>
    <div class="cross" data-t="2000">✗</div>
  </div>
  <div class="arrow" data-t="2700">↓</div>
  <div class="lbl-s" data-t="3100" style="background:var(--red)">СТАЛО</div>
  <div id="after" data-t="3400">
    <div class="val">12 МИНУТ</div><div class="sub">агент собирает черновик сам</div>
  </div>
  <div class="spacer"></div>
  <div class="cta" data-t="5200"><span>Забирай пайплайн</span><span>→</span></div>
</div></div>
<script src="../../shared.js"></script>
</body>
</html>
