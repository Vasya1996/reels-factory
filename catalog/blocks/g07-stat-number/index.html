<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>G07 · stat_number</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  #scene{align-items:center;text-align:center;justify-content:center}
  .tech{align-self:center}
  #big{margin-top:60px;background:var(--yellow);border:8px solid var(--ink);
    border-radius:38px 240px 34px 225px / 225px 34px 240px 38px;
    padding:20px 90px;font-family:MontserratX,sans-serif;font-weight:900;font-size:560px;line-height:1;
    letter-spacing:-.04em;color:var(--ink);box-shadow:14px 16px 0 var(--ink);
    opacity:0;transform:rotate(-2deg) scale(.4)}
  #big.in{opacity:1;transform:rotate(-2deg) scale(1);transition:opacity .22s var(--ease-pop),transform .46s var(--ease-pop)}
  #sub{margin-top:90px;font-family:MontserratX,sans-serif;font-weight:900;font-size:74px;text-transform:uppercase;color:var(--ink)}
  .note{margin-top:44px;font-family:CaveatX,cursive;font-size:56px;color:var(--red);transform:rotate(-1.5deg);opacity:0}
  .note.in{opacity:1;transition:opacity .3s var(--ease)}
</style>
</head>
<body>
<div id="fit"><div id="scene">
  <div class="tech" data-t="0"><span class="dash"></span><span class="lbl">Хук · Цифра-факт</span></div>
  <div id="big" data-t="500">3</div>
  <div id="sub">
    <span class="w" data-t="1300">ВОПРОСА</span> <span class="w" data-t="1520">РЕШАЮТ</span><br>
    <span class="w hl" data-t="1800"><i></i>ЛЮБУЮ ПРОДАЖУ</span>
  </div>
  <div class="note" data-t="2700">остальное — надстройка</div>
</div></div>
<script src="../../shared.js"></script>
</body>
</html>
