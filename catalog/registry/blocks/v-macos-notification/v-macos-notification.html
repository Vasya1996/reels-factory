<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
        /* Google Fonts <link> removed (rule: strip external font refs); the
           gap is filled by the family we already render Cyrillic through,
           declared twice per the schema-forms convention. */
        font-family: "Manrope", sans-serif;
        --mk-font: "Manrope", sans-serif;
      }

      /* portrait: portraitPx = round(landscapePx * 1.3) on every chrome
         token; the card width itself is fit to width 1080 with 32px side
         padding (24-36px band) instead of scaled, and the card sits inside
         the safe zone y in [12%, 78%] (230-1498), clear of both the top
         status-bar strip and the bottom 22% platform-UI band. */
      [data-composition-id="v-macos-notification"] .notification-card {
        position: absolute;
        top: 260px;
        left: 32px;
        width: 1016px;
        background: rgba(30, 30, 30, 0.82);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border-radius: 20px;
        padding: 20px;
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.4),
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.1);
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }

      [data-composition-id="v-macos-notification"] .app-icon {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        flex-shrink: 0;
        overflow: hidden;
      }

      [data-composition-id="v-macos-notification"] .app-icon svg {
        width: 48px;
        height: 48px;
        display: block;
      }

      [data-composition-id="v-macos-notification"] .notification-content {
        flex: 1;
        min-width: 0;
      }

      [data-composition-id="v-macos-notification"] .notification-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }

      [data-composition-id="v-macos-notification"] .app-name {
        font-size: 16px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }

      [data-composition-id="v-macos-notification"] .time-label {
        font-size: 16px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.35);
      }

      [data-composition-id="v-macos-notification"] .notification-title {
        font-size: 20px;
        font-weight: 600;
        color: #ffffff;
        line-height: 1.3;
        margin-bottom: 4px;
      }

      [data-composition-id="v-macos-notification"] .notification-body {
        font-size: 16px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="v-macos-notification"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="5"
    >
      <div
        id="notification"
        class="clip notification-card"
        data-start="0"
        data-duration="5"
        data-track-index="0"
      >
        <div class="app-icon">
          <svg viewBox="0 0 36 36" fill="none">
            <defs>
              <linearGradient
                id="icon-grad"
                x1="0"
                y1="0"
                x2="36"
                y2="36"
                gradientUnits="userSpaceOnUse"
              >
                <!-- darkened from the source #6366f1/#8b5cf6: those stops give
                     the white "HF" glyph 4.37:1, under the 4.5:1 AA floor
                     their own contrast-audit enforces (pre-existing in the
                     landscape source too, confirmed against it unmodified) -->
                <stop offset="0%" stop-color="#4f46e5" />
                <stop offset="100%" stop-color="#7c3aed" />
              </linearGradient>
            </defs>
            <rect width="36" height="36" rx="8" fill="url(#icon-grad)" />
            <text
              x="18"
              y="23"
              text-anchor="middle"
              font-family="Manrope, sans-serif"
              font-size="14"
              font-weight="700"
              fill="#fff"
            >
              HF
            </text>
          </svg>
        </div>
        <div class="notification-content">
          <div class="notification-header">
            <span class="app-name">HyperFrames</span>
            <span class="time-label">now</span>
          </div>
          <div class="notification-title">Prompt to replace this title</div>
          <div class="notification-body">
            Prompt to change this body text, the app icon, and the app name to match your content.
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });
      var notification = document.getElementById("notification");

      // Start off-screen to the right
      gsap.set(notification, { x: 420, opacity: 0 });

      // Slide in from right
      tl.to(
        notification,
        {
          x: 0,
          opacity: 1,
          duration: 0.5,
          ease: "power3.out",
        },
        0.2,
      );

      // Slide out to right
      tl.to(
        notification,
        {
          x: 420,
          opacity: 0,
          duration: 0.3,
          ease: "power3.in",
        },
        4.2,
      );

      window.__timelines["v-macos-notification"] = tl;
    </script>
  </body>
</html>
