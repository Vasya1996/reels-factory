#g04-root,#g04-root *{box-sizing:border-box}
#g04-root{position:relative;width:1080px;height:1920px;overflow:hidden;margin:0;padding:0;
--paper:#F2F0E9;--card:#FCFBF6;--ink:#1B1B18;--yellow:#FFD84D;--mint:#A8DCCB;--red:#E0503A;
--red-dark:#B8402C;--grid:rgba(20,60,80,.18);--muted:#4A4A44;--dim:#77776E;
--shadow-card:8px 10px 0 rgba(27,27,24,.16);--shadow-cta:10px 12px 0 var(--ink);
font-family:ManropeX,sans-serif;color:var(--ink)}
.g04-bg{position:absolute;inset:0;z-index:0;background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
background-size:67px 67px}
.g04-scene{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;padding:118px 84px 104px}
.g04-tech{display:flex;align-items:center;gap:26px;margin-bottom:54px}
.g04-dash{width:68px;height:8px;background:var(--ink);display:block;flex:none}
.g04-lbl{font-family:JBMonoX,monospace;font-weight:700;font-size:28px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.g04-sticker{align-self:flex-start;background:var(--yellow);padding:6px 30px;
font-family:MontserratX,sans-serif;font-weight:900;font-size:150px;line-height:1.05;letter-spacing:-.03em;color:var(--ink)}
.g04-h1{font-family:MontserratX,sans-serif;font-weight:900;font-size:108px;line-height:1.12;letter-spacing:-.02em;
color:var(--ink);margin:42px 0 0;text-transform:uppercase}
.g04-line{display:block}
.g04-w{display:inline-block}
.g04-hl{position:relative;display:inline-block;padding:0 16px}
.g04-hl i{position:absolute;inset:0;display:block;background:var(--mint);z-index:-1}
.g04-pill{display:flex;align-items:center;gap:34px;background:var(--card);border:6px solid var(--ink);
padding:40px 50px;box-shadow:var(--shadow-card);position:relative}
.g04-r1{border-radius:255px 34px 225px 38px / 38px 225px 34px 255px}
.g04-r2{border-radius:38px 240px 34px 225px / 225px 34px 240px 38px}
.g04-r3{border-radius:225px 38px 255px 34px / 34px 255px 38px 225px}
.g04-r4{border-radius:240px 38px 225px 34px / 34px 225px 38px 240px}
.g04-idx{font-family:CaveatX,cursive;font-weight:700;font-size:66px;line-height:1;color:var(--ink);width:76px;flex:none}
.g04-txt{flex:1;font-size:40px;font-weight:600;color:var(--ink)}
.g04-tick{font-family:CaveatX,cursive;font-size:76px;line-height:.8;color:var(--red);flex:none}
.g04-su{position:absolute;left:44px;right:44px;top:52%;height:7px;background:var(--red);border-radius:4px;display:block}
.g04-cta{align-self:flex-start;background:var(--red);color:var(--card);border:6px solid var(--ink);
border-radius:240px 38px 225px 34px / 34px 225px 38px 240px;padding:44px 58px;box-shadow:var(--shadow-cta);
font-family:MontserratX,sans-serif;font-weight:900;font-size:40px;text-transform:uppercase;
display:flex;gap:34px;align-items:center}
.g04-spacer{flex:1}
.g04-note{font-family:CaveatX,cursive;font-size:56px;color:var(--red)}
.g04-slot{border:6px dashed rgba(27,27,24,.5);display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:10px;background:rgba(252,251,246,.35)}
.g04-sl{font-family:JBMonoX,monospace;font-weight:700;font-size:26px;letter-spacing:.12em;
color:var(--muted);text-transform:uppercase;text-align:center;display:block}

.g04-scene{padding:0}
.g04-stage{position:absolute;inset:0;overflow:hidden}
.g04-plate{position:absolute;left:-6%;top:-6%;width:112%;height:112%;
background:linear-gradient(160deg,rgba(168,220,203,.4),transparent 60%),
linear-gradient(20deg,rgba(255,216,77,.35),transparent 50%),var(--paper);
display:flex;align-items:center;justify-content:center}
.g04-slot{width:70%;height:52%;border-width:8px}
.g04-attr{position:absolute;top:120px;left:60px;font-family:JBMonoX,monospace;font-size:26px;letter-spacing:.12em;
color:var(--ink);background:rgba(252,251,246,.92);border:4px solid var(--ink);padding:10px 20px;white-space:nowrap}
.g04-cap{position:absolute;left:60px;right:60px;bottom:170px;text-align:center;
font-family:MontserratX,sans-serif;font-weight:900;font-size:56px;text-transform:uppercase;color:var(--ink);
background:var(--card);border:5px solid var(--ink);padding:22px 34px;box-shadow:6px 8px 0 rgba(27,27,24,.16);border-radius:22px}
    </style>
  </head>
  <body>
    <div
      id="g04-root"
      data-composition-id="g04-broll-fullscreen"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="5"
    >
      <div
        id="g04-clip"
        class="clip"
        data-start="0"
        data-duration="5"
        data-track-index="1"
      >
        <div class="g04-bg"></div>
        <div class="g04-scene">
<div class="g04-stage" data-layout-allow-overflow="true">
  <div class="g04-plate">
    <!-- СЛОТ ПОД B-ROLL: заменить на <video id="g04-broll" src="…" data-start="0" data-duration="5" data-track-index="1" muted playsinline></video> или <img id="g04-broll" src="…"> -->
    <div id="g04-broll-slot" class="g04-slot" data-slot="video" data-slot-role="broll">
      <span class="g04-sl">B-roll slot</span>
      <span class="g04-sl">g04-broll</span>
    </div>
  </div>
</div>
<div class="g04-attr">источник · плейсхолдер</div>
<div class="g04-cap"><span class="g04-w g04-wa">ПОДПИСЬ</span> <span class="g04-w g04-wa">К</span> <span class="g04-w g04-wa">ПЕРЕБИВКЕ</span></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
var tl=gsap.timeline({paused:true});
function fi(s,at,d){tl.fromTo(s,{autoAlpha:0},{autoAlpha:1,duration:d||0.34,ease:"power2.out"},at);}
function fu(s,at,dy,d){tl.fromTo(s,{autoAlpha:0,y:(dy===undefined?16:dy)},{autoAlpha:1,y:0,duration:d||0.34,ease:"power3.out"},at);}
function pop(s,at,o){o=o||{};tl.fromTo(s,{autoAlpha:0,scale:(o.from===undefined?0.7:o.from),rotation:(o.rot||0)},{autoAlpha:1,scale:1,rotation:(o.rot||0),duration:(o.d||0.42),ease:"back.out(1.6)"},at);}
function card(s,at,o){o=o||{};tl.fromTo(s,{autoAlpha:0,y:(o.dy===undefined?30:o.dy),rotation:(o.rot||0)},{autoAlpha:1,y:0,rotation:(o.rot||0),duration:(o.d||0.44),ease:"power3.out"},at);}
function hl(s,at,d){tl.fromTo(s,{scaleX:0,transformOrigin:"left center"},{scaleX:1,duration:d||0.3,ease:"power3.out"},at);}
function words(s,at,step){tl.fromTo(s,{autoAlpha:0,y:14},{autoAlpha:1,y:0,duration:0.24,ease:"power3.out",stagger:(step||0.22)},at);}
tl.fromTo(".g04-plate",{scale:1,y:0},{scale:1.09,y:-26,duration:5,ease:"none"},0);
fi(".g04-attr",0.40,0.34);
words(".g04-wa",0.90,0.22);
        window.__timelines["g04-broll-fullscreen"] = tl;
      })();
    </script>
  </body>
